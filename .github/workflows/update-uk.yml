name: update-uk.yml

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
          - full
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 4 * * 0"

permissions:
  contents: write

concurrency:
  group: update-uk-mp-data
  cancel-in-progress: false

jobs:
  update-uk-mp-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMMONS_SCORE_RUN_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0' && 'full' || github.event.inputs.run_mode || 'fast' }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check updater
        run: python -m py_compile scripts/update_uk.py scripts/commons_score/*.py scripts/validate_data.py

      - name: Build Commons Score evidence and ranking
        run: python scripts/update_uk.py

      - name: Validate generated data before commit
        run: python scripts/validate_data.py

      - name: Commit updated data
        run: |
          git config user.name "commons-score-bot"
          git config user.email "actions@github.com"
          git add data/ranked_mps.json data/source_records.json data/history
          git diff --cached --quiet || git commit -m "Update Commons Score generated data"
          git push
