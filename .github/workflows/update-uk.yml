name: update-uk.yml

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-uk-mp-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build full Commons Score evidence and ranking
        run: python scripts/update_uk.py

      - name: Commit updated data
        run: |
          git config user.name "commons-score-bot"
          git config user.email "actions@github.com"
          git add data/source_records.json data/ranked_mps.json
          git diff --cached --quiet || git commit -m "Update full Commons Score ranking"
          git push
